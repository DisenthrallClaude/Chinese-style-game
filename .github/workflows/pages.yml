name: 部署到 GitHub Pages

# Pages 用的是经典的分支模式（source = gh-pages）。
# 之所以不走 actions/deploy-pages，是因为默认的 GITHUB_TOKEN 没有权限
# 首次创建 Pages 站点（Resource not accessible by integration）；
# 而往 gh-pages 分支推送在公开仓库上会自动开启 Pages。
on:
  push:
    branches: [claude/shanhaijing-game-design-cqp2gj]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 整理静态站点
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          cp -r styles src vendor docs _site/
          # 关掉 Jekyll，否则以下划线开头的路径会被吞掉
          touch _site/.nojekyll
          du -sh _site

      - name: 推送到 gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "部署 ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
